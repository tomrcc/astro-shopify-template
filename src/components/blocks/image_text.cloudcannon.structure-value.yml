preview:
  text:
    - key: heading
    - Image and text
  icon:
    - vertical_split
  image:
    - key: image
value:
  _type: image_text
  heading: A heading
  content: Some text about this.
  image:
  image_alt:
  image_side: left
  button:
    label:
